[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbin-platform"
version = "0.1.0"
description = "BBIN Hydropower Intelligence, Cross-Border Trading and Settlement Platform — foundational safety-critical cores (Python reference implementation)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["hypothesis>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bbin_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
